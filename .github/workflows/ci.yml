name: CI Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tournois
          POSTGRES_USER: r5a5
          POSTGRES_PASSWORD: r5a5
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U r5a5 -d tournois"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+pg8000://r5a5:r5a5@127.0.0.1:5432/tournois
      FLASK_SECRET_KEY: test-secret-key-for-ci-1234567890
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Le service postgres démarre avec une base VIDE : contrairement à docker-compose.yml, rien ne monte
      # le dossier sql/ dans docker-entrypoint-initdb.d. On rejoue donc ici, dans le même ordre que Docker
      # (alphabétique), le schéma puis les tests d'intégrité de la base.
      - name: Créer le schéma de la base
        env:
          PGPASSWORD: r5a5
        run: |
          psql -h 127.0.0.1 -U r5a5 -d tournois -v ON_ERROR_STOP=1 -f sql/schema_R5A5_sujetB.sql
          psql -h 127.0.0.1 -U r5a5 -d tournois -v ON_ERROR_STOP=1 -f sql/tests_contraintes.sql

      - name: Run tests
        run: |
          python -m pytest -q
