name: CI Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tournois
          POSTGRES_USER: r5a5
          POSTGRES_PASSWORD: r5a5
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U r5a5 -d tournois"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+pg8000://r5a5:r5a5@127.0.0.1:5432/tournois
      FLASK_SECRET_KEY: test-secret-key-for-ci-1234567890
      PYTHON_VERSION: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: |
          python -m pytest -q
