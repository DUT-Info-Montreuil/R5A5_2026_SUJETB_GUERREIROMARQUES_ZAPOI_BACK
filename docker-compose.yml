# =============================================================================
#  R5A5 — Sujet B : environnement de développement
#  À placer à la racine du dépôt BACK.
#
#  Démarrer :   docker compose up -d
#  Arrêter  :   docker compose down
#  Repartir de zéro (efface les données) : docker compose down -v
# =============================================================================

services:

  db:
    image: postgres:16
    container_name: r5a5_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: r5a5
      POSTGRES_PASSWORD: r5a5
      POSTGRES_DB: tournois
    ports:
      # Exposé sur l'hôte pour que Flask et pgAdmin/DBeaver puissent s'y connecter.
      # 127.0.0.1 : la machine seule. Sans cette adresse, Docker publie le port sur
      # toutes les interfaces, et n'importe qui sur le même Wi-Fi pourrait se connecter
      # avec r5a5/r5a5 et se nommer administrateur.
      # Si le port 5432 est déjà pris sur votre machine, mettez "127.0.0.1:5433:5432".
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Les fichiers .sql de ce dossier sont exécutés dans l'ordre alphabétique,
      # UNIQUEMENT à la première création du volume (voir note en bas).
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r5a5 -d tournois"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Interface web pour regarder la base sans installer de client lourd.
  # Accessible sur http://localhost:8080
  # Serveur : db   —   Utilisateur : r5a5   —   Mot de passe : r5a5   —   Base : tournois
  adminer:
    image: adminer:latest
    container_name: r5a5_adminer
    restart: unless-stopped
    ports:
      # 127.0.0.1 : Adminer donne la main sur toute la base, il ne s'ouvre pas au réseau.
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

# =============================================================================
#  NOTE IMPORTANTE
#
#  Le dossier ./sql n'est rejoué QU'À LA PREMIÈRE création du volume.
#  Si vous modifiez le schéma ensuite, relancer `docker compose up` ne change
#  rien : il faut soit rejouer le script à la main
#
#      docker compose exec -T db psql -U r5a5 -d tournois < sql/schema_R5A5_sujetB.sql
#
#  soit tout réinitialiser
#
#      docker compose down -v && docker compose up -d
#
#  Le mot de passe en clair ici n'est valable QUE pour le développement local.
#  En déploiement, il passera par une variable d'environnement non versionnée.
# =============================================================================